# generate engine — backend preference per asset-type.
#
# The `generate` engine walks each list in order, health-gates every candidate
# (is its key present? does `generate/comfy-gate` pass for the local ComfyUI?),
# and uses the FIRST that passes — falling through to the next,
# or reporting "no working backend" if none do. It never fabricates output.
#
# Edit an order to change which backend generate prefers for that asset kind.
# comfy is the local/free option; the rest are paid cloud services.

[image]
backends = ["gemini", "openai", "comfy"]

[texture]
backends = ["comfy", "gemini"]

[video]
backends = ["comfy"]

[model]
backends = ["tripo"]

[music]
backends = ["comfy", "elevenlabs"]

[sfx]
backends = ["comfy", "elevenlabs"]

[dialogue]
backends = ["elevenlabs"]

# --- provider registry: how the engine health-gates each backend ---

[providers.comfy]
kind = "local"
# One definition for every asset type. Run it, paste its last line, exit 0 = pass.
# Behind llama-broker it reads only /api/tenants and /running, so it never starts the
# container; a higher-priority tenant with wantsGPU=true fails it ("GPU held by <tenant>").
health = "generate/comfy-gate"
driver = "comfy plugin generate_image / generate_audio MCP tools"

[providers.gemini]
kind = "cloud"
env = "GEMINI_API_KEY or GOOGLE_API_KEY"

[providers.openai]
kind = "cloud"
env = "OPENAI_API_KEY"

[providers.tripo]
kind = "cloud"
env = "TRIPO_API_KEY"

[providers.elevenlabs]
kind = "cloud"
env = "ELEVENLABS_API_KEY"
