<style>
  .r__ROUND__ { min-height: 100%; background: #f4f5f8; color: #16181d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; }
  .r__ROUND__ h1 { font-size: 19px; margin: 0 0 4px; }
  .r__ROUND__ .sub { color: #6a6d78; font-size: 13px; margin: 0 0 18px; }
  .r__ROUND__ .card { background: #fff; border: 1px solid #dfe1e7; border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .r__ROUND__ .name { font-weight: 600; }
  .r__ROUND__ .meta { color: #6a6d78; font-size: 13px; }
  .r__ROUND__ .btn { border: 0; background: #2f6df6; color: #fff; border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .r__ROUND__.alt .card { border-radius: 0; border-left: 0; border-right: 0; margin: 0; }
</style>

<nav data-axis="state__ROUND__" data-label="Data">
  <button data-value="full">Three sessions</button>
  <button data-value="empty">No sessions<em>first run</em></button>
</nav>

<template data-variant="__NAME__" data-caption="round __ROUND__ direction A">
  <div class="r__ROUND__">
    <h1>Sessions</h1>
    <p class="sub">round __ROUND__ &middot; __NAME__</p>
    <div data-s__ROUND__="full">
      <div class="card"><div><div class="name">reddit-poker</div><div class="meta">2 minutes ago</div></div><button class="btn">Resume</button></div>
      <div class="card"><div><div class="name">admin-project-tool</div><div class="meta">yesterday</div></div><button class="btn">Resume</button></div>
      <div class="card"><div><div class="name">.claude</div><div class="meta">3 days ago</div></div><button class="btn">Resume</button></div>
    </div>
    <div data-s__ROUND__="empty" hidden>
      <div class="card" style="justify-content:center;color:#6a6d78">Nothing running yet.</div>
    </div>
  </div>
</template>

<template data-variant="__NAME__ tight" data-caption="round __ROUND__ direction B">
  <div class="r__ROUND__ alt">
    <h1>Sessions</h1>
    <p class="sub">round __ROUND__ &middot; __NAME__, tighter</p>
    <div data-s__ROUND__="full">
      <div class="card"><div><div class="name">reddit-poker</div><div class="meta">2 minutes ago</div></div><button class="btn">Resume</button></div>
      <div class="card"><div><div class="name">admin-project-tool</div><div class="meta">yesterday</div></div><button class="btn">Resume</button></div>
      <div class="card"><div><div class="name">.claude</div><div class="meta">3 days ago</div></div><button class="btn">Resume</button></div>
    </div>
    <div data-s__ROUND__="empty" hidden>
      <div class="card" style="justify-content:center;color:#6a6d78">Nothing running yet.</div>
    </div>
  </div>
</template>

<script>
  addEventListener('at:axis', function (e) {
    if (e.detail.axis !== 'state__ROUND__') return;
    document.querySelectorAll('[data-s__ROUND__]').forEach(function (el) {
      el.hidden = el.getAttribute('data-s__ROUND__') !== e.detail.value;
    });
  });
</script>
